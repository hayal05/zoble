{% extends "base.html" %}
{% block title %}Log in · Zoble Chat{% endblock %}

{% block body %}
<div class="auth-screen">
    <div class="auth-card">
        <div class="brand-mark">
            <span class="brand-dot"></span>
            <span class="brand-word">Zoble Chat</span>
        </div>
        <form id="loginForm" class="auth-form" novalidate>
            <p class="field-success" id="resetSuccessNotice" hidden>Password reset. Log in with your new password.</p>

            <label class="field-label" for="username">Username, email, or phone number</label>
            <input class="field-input" type="text" id="username" name="username" autocomplete="username" required>

            <label class="field-label" for="password">Password</label>
            <div class="field-password-wrap">
                <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required>
                <button type="button" class="field-password-toggle" data-target="password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>

            <p class="field-error" id="loginError" hidden></p>

            <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>

        <p class="auth-switch"><a href="{{ url_for('forgot_password_page') }}">Forgot password?</a></p>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register_page') }}">Create one</a></p>
    </div>
</div>

<script>
    if (new URLSearchParams(window.location.search).get("reset") === "1") {
        document.getElementById("resetSuccessNotice").hidden = false;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("loginError");
        errorEl.hidden = true;

        const payload = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
        };

        const submitBtn = document.querySelector("#loginForm button[type=submit]");
        submitBtn.disabled = true;
        submitBtn.classList.add("is-loading");

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.error || "Something went wrong.";
                errorEl.hidden = false;
                return;
            }

            // Left in its loading state on success — the page is about to
            // navigate away, so there's no "done" moment to reset it at.
            window.location.href = "/";
        } catch (err) {
            errorEl.textContent = "Network error. Please try again.";
            errorEl.hidden = false;
        } finally {
            if (!errorEl.hidden) {
                submitBtn.disabled = false;
                submitBtn.classList.remove("is-loading");
            }
        }
    });
</script>
{% endblock %}
